<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos | ECORUTAS</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/contacto.css">
</head>
<body> 
    <header class="site-header" role="banner">
    <nav class="navbar" aria-label="Navegación principal">
      <a href="../index.html" class="navbar__logo" aria-label="Inicio de ECORUTAS">ECORUTAS</a>
            <ul class="navbar__links" role="list">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./rutas.html">Rutas</a></li>
                <li><a href="./contacto.html" aria-current="page">Contacto</a></li>
                <li><a href="./sobre_nosotros.html">Sobre nosotros</a></li>
            </ul>
    </nav>
  </header>
    <main class="contacto-container">
        
        <section class="contacto-info">
            <h1>Información de Contacto</h1>
            <ul>
                <li><strong>Correo:</strong> ejemplo@correo.com</li>
                <li><strong>Teléfono:</strong> +56 9 1234 5678</li>
                <li><strong>Dirección:</strong> Temuco, Región de la Araucanía</li>
            </ul>
        </section>

        <section class="contacto-form-section">
            <h2>Envíanos un mensaje</h2>

            <!-- Mensaje de estado global -->
            <div id="status-message" class="status-message" aria-live="polite"></div>

            <form class="contacto-form" id="contacto-form" action="#" method="post" novalidate>
                <div class="form-group">    
                    <label for="nombre">Nombre <span aria-hidden="true">*</span></label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        placeholder="Tu nombre" 
                        required 
                        aria-required="true"
                        aria-describedby="error-nombre"
                    >
                    <span id="error-nombre" class="error-text" aria-live="assertive"></span>
                </div>

                <div class="form-group">
                    <label for="email">Correo <span aria-hidden="true">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="tu@email.com" 
                        required 
                        aria-required="true"
                        aria-describedby="error-email"
                    >
                    <span id="error-email" class="error-text" aria-live="assertive"></span>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje <span aria-hidden="true">*</span></label>
                    <textarea 
                        id="mensaje" 
                        name="mensaje" 
                        rows="4" 
                        placeholder="Escribe tu mensaje aquí..." 
                        required 
                        aria-required="true"
                        aria-describedby="error-mensaje"
                    ></textarea>
                    <span id="error-mensaje" class="error-text" aria-live="assertive"></span>
                </div>

                <button type="submit">Enviar Mensaje</button>
            </form>
        </section>

    </main>

    <footer class="footer" role="contentinfo">
        <p>&copy; 2026 Descubre la Naturaleza. Todos los derechos reservados.</p>
    </footer>
    <script src="../js/contacto.js"></script>
</body>
</html>
